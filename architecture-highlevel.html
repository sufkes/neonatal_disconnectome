<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disconnectome — Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f8f9fc;
    color: #1a1d2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
  }

  .page {
    width: 100%;
    max-width: 960px;
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    color: #1a1d2e;
    margin-bottom: 4px;
  }

  .sub {
    font-size: 12px;
    color: #8b92a9;
    margin-bottom: 40px;
    letter-spacing: 0.3px;
  }

  /* ── Layers ─────────────────────────────────── */
  .layer {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 0;
    position: relative;
  }

  .layer-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8b92a9;
    width: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .layer-content {
    flex: 1;
    display: flex;
    gap: 10px;
    padding: 16px;
    border-radius: 12px;
    align-items: center;
  }

  /* layer colours */
  .layer-ui     .layer-content { background: #eef4ff; border: 1.5px solid #c5d9f7; }
  .layer-service .layer-content { background: #f3f0ff; border: 1.5px solid #d5caff; }
  .layer-process .layer-content { background: #edfbf4; border: 1.5px solid #b6ecce; }
  .layer-data   .layer-content { background: #fff7ed; border: 1.5px solid #fdd6aa; }

  /* ── Boxes ──────────────────────────────────── */
  .box {
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    border: 1.5px solid transparent;
    cursor: default;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .box:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  }

  .box sub {
    display: block;
    font-size: 9px;
    font-weight: 400;
    color: inherit;
    opacity: 0.7;
    margin-top: 2px;
  }

  /* box colours */
  .b-ui      { background: #fff; border-color: #93bef5; color: #1a5dbf; }
  .b-screen  { background: #fff; border-color: #c4a9f7; color: #6931d4; }
  .b-svc     { background: #fff; border-color: #b9aff5; color: #4c35c7; }
  .b-proc    { background: #fff; border-color: #84d6b0; color: #12794d; }
  .b-data    { background: #fff; border-color: #f9b97a; color: #b35a10; }

  /* ── Connector rows ─────────────────────────── */
  .connector-row {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 36px;
    position: relative;
    margin: 0 36px;
  }

  .connector-row svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }

  /* ── Arrow legend ───────────────────────────── */
  .arrow-legend {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 32px;
    padding: 14px 20px;
    background: #fff;
    border: 1px solid #e4e7f0;
    border-radius: 10px;
  }

  .al-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #6b7280;
  }

  .al-line {
    width: 32px;
    height: 2px;
    border-radius: 2px;
  }

  /* ── Central SVG diagram ────────────────────── */
  .diagram-wrap {
    background: #fff;
    border: 1px solid #e4e7f0;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
  }

  svg.main {
    width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
